<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Anonymous research project page for SICHER.">
    <meta name="theme-color" content="#ffffff">
    <title>SICHER · Project Page</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body id="top">
    <header class="site-header">
      <nav class="navigation container" aria-label="Main navigation">
        <a class="wordmark" href="#top" aria-label="SICHER, back to top">SICHER<span class="wordmark-dot" aria-hidden="true"></span></a>
        <div class="navigation-links">
          <a href="#overview">Overview</a>
          <a href="#method">Method</a>
          <a href="#results">Results</a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="paper-heading">
        <h1>
          <a class="image-link title-image" href="assets/title.png" target="_blank" rel="noopener noreferrer" title="Open original image">
            <picture>
              <source media="(max-width: 720px)" srcset="assets/title-mobile.png">
              <img src="assets/title.png" alt="SICHER paper title and anonymous authors" fetchpriority="high">
            </picture>
            <span class="image-expand" aria-hidden="true">↗</span>
          </a>
        </h1>
      </div>

      <section class="research-section overview-section" id="overview" aria-labelledby="overview-heading">
        <div class="section-heading">
          <span class="section-number" aria-hidden="true">01</span>
          <h2 id="overview-heading">Overview</h2>
        </div>
        <div class="figure-scroll abstract-scroll" tabindex="0" role="region" aria-label="Paper abstract image">
          <a class="image-link abstract-image" href="assets/abstract.png" target="_blank" rel="noopener noreferrer" title="Open original image">
            <picture>
              <source media="(max-width: 720px)" srcset="assets/abstract-mobile.png">
              <img src="assets/abstract.png" alt="SICHER abstract" decoding="async">
            </picture>
            <span class="image-expand" aria-hidden="true">↗</span>
          </a>
        </div>
      </section>

      <section class="research-section" id="method" aria-labelledby="method-heading">
        <div class="section-heading">
          <span class="section-number" aria-hidden="true">02</span>
          <h2 id="method-heading">Method</h2>
        </div>
        <figure class="research-figure">
          <div class="figure-scroll" tabindex="0" role="region" aria-label="Scrollable framework figure">
            <a class="image-link detailed-image" href="assets/framework.png" target="_blank" rel="noopener noreferrer" title="Open original image">
              <img src="assets/framework.png" alt="SICHER framework overview" loading="lazy" decoding="async">
              <span class="image-expand" aria-hidden="true">↗</span>
            </a>
          </div>
          <figcaption><span class="figure-label">Figure 1</span>Framework overview.</figcaption>
        </figure>
        <figure class="research-figure secondary-figure">
          <div class="figure-scroll" tabindex="0" role="region" aria-label="Scrollable rectification figure">
            <a class="image-link detailed-image" href="assets/rectification.png" target="_blank" rel="noopener noreferrer" title="Open original image">
              <img src="assets/rectification.png" alt="Cross-modal deviation modeling and hypergraph rectification" loading="lazy" decoding="async">
              <span class="image-expand" aria-hidden="true">↗</span>
            </a>
          </div>
          <figcaption><span class="figure-label">Figure 2</span>Cross-modal deviation modeling and hypergraph rectification.</figcaption>
        </figure>
      </section>

      <section class="research-section results-section" id="results" aria-labelledby="results-heading">
        <div class="section-heading">
          <span class="section-number" aria-hidden="true">03</span>
          <h2 id="results-heading">Results</h2>
        </div>
        <figure class="research-figure">
          <div class="figure-scroll" tabindex="0" role="region" aria-label="Scrollable quantitative results figure">
            <a class="image-link detailed-image results-image" href="assets/results.png" target="_blank" rel="noopener noreferrer" title="Open original image">
              <img src="assets/results.png" alt="Few-shot detection and localization results on MVTec 3D-AD and Eyecandies" loading="lazy" decoding="async">
              <span class="image-expand" aria-hidden="true">↗</span>
            </a>
          </div>
          <figcaption><span class="figure-label">Quantitative results</span>MVTec 3D-AD and Eyecandies.</figcaption>
        </figure>
        <figure class="research-figure secondary-figure">
          <div class="figure-scroll" tabindex="0" role="region" aria-label="Scrollable qualitative results figure">
            <a class="image-link detailed-image" href="assets/qualitative.png" target="_blank" rel="noopener noreferrer" title="Open original image">
              <img src="assets/qualitative.png" alt="Qualitative anomaly localization comparisons" loading="lazy" decoding="async">
              <span class="image-expand" aria-hidden="true">↗</span>
            </a>
          </div>
          <figcaption><span class="figure-label">Qualitative results</span>Anomaly localization comparisons.</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer container">
      <span>SICHER</span>
      <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </footer>
  </body>
</html>
